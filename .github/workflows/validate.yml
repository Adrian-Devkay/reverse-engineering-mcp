name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-mcp.txt -r requirements-dev.txt
      - name: Validate frontmatter and placeholders
        run: |
          python - <<'PY'
          from pathlib import Path

          skill = Path("SKILL.md").read_text(encoding="utf-8")
          assert skill.startswith("---\n")
          assert "name: reverse-engineering-mcp" in skill
          assert "TODO" not in skill
          assert "<skill-name>" not in skill
          print("skill frontmatter: ok")
          PY
      - name: Compile Python sources
        run: python -m py_compile mcp_server.py scripts/init_case.py
      - name: Run tests
        run: python -m pytest -q
