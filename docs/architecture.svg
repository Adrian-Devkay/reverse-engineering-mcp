<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Reverse Engineering MCP architecture</title>
  <desc id="desc">A layered architecture showing the analyst, scope and evidence controls, the read-only MCP server, optional analysis backends, and evidence-backed reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #cbd5e1; }
      .label { font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .body { font: 400 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #e2e8f0; }
      .small { font: 600 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #bfdbfe; letter-spacing: .4px; }
      .line { stroke: #93c5fd; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .boundary { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="56" y="62" class="title">Reverse Engineering MCP</text>
  <text x="56" y="91" class="subtitle">Evidence-first analysis with explicit trust boundaries and controlled escalation</text>

  <rect x="40" y="120" width="1120" height="112" rx="18" class="boundary"/>
  <text x="62" y="146" class="small">ANALYST CONTROL PLANE</text>
  <rect x="64" y="163" width="232" height="48" rx="12" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="180" y="193" text-anchor="middle" class="label">Authorized scope</text>
  <rect x="326" y="163" width="232" height="48" rx="12" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="442" y="193" text-anchor="middle" class="label">Hash-first evidence</text>
  <rect x="588" y="163" width="232" height="48" rx="12" fill="url(#violet)" filter="url(#shadow)"/>
  <text x="704" y="193" text-anchor="middle" class="label">Confidence labels</text>
  <rect x="850" y="163" width="232" height="48" rx="12" fill="url(#amber)" filter="url(#shadow)"/>
  <text x="966" y="193" text-anchor="middle" class="label">Approval gates</text>

  <line x1="180" y1="232" x2="180" y2="284" class="line"/>
  <line x1="442" y1="232" x2="442" y2="284" class="line"/>
  <line x1="704" y1="232" x2="704" y2="284" class="line"/>
  <line x1="966" y1="232" x2="966" y2="284" class="line"/>

  <rect x="40" y="284" width="1120" height="154" rx="18" class="boundary"/>
  <text x="62" y="310" class="small">LOCAL MCP AND CASE LAYER</text>
  <rect x="64" y="330" width="332" height="82" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230" y="357" text-anchor="middle" class="label">Read-only MCP server</text>
  <text x="230" y="380" text-anchor="middle" class="body">hashes · metadata · strings · disassembly</text>
  <text x="230" y="399" text-anchor="middle" class="body">bounded reads · no shell · no network</text>
  <rect x="434" y="330" width="332" height="82" rx="14" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="357" text-anchor="middle" class="label">Case and provenance</text>
  <text x="600" y="380" text-anchor="middle" class="body">manifests · source integrity · SBOM</text>
  <text x="600" y="399" text-anchor="middle" class="body">commands · versions · reproducibility</text>
  <rect x="804" y="330" width="308" height="82" rx="14" fill="#4c1d95" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="958" y="357" text-anchor="middle" class="label">Policy enforcement</text>
  <text x="958" y="380" text-anchor="middle" class="body">allowlists · resource limits</text>
  <text x="958" y="399" text-anchor="middle" class="body">fail-closed web and lab gates</text>

  <line x1="230" y1="438" x2="230" y2="490" class="line"/>
  <line x1="600" y1="438" x2="600" y2="490" class="line"/>
  <line x1="958" y1="438" x2="958" y2="490" class="line"/>

  <rect x="40" y="490" width="1120" height="132" rx="18" class="boundary"/>
  <text x="62" y="516" class="small">OPTIONAL, EXPLICITLY ENABLED ANALYSIS PLANE</text>
  <rect x="64" y="535" width="236" height="62" rx="12" fill="#1e3a8a"/>
  <text x="182" y="561" text-anchor="middle" class="label">Static recovery</text>
  <text x="182" y="582" text-anchor="middle" class="body">Ghidra · radare2 · Capstone</text>
  <rect x="326" y="535" width="236" height="62" rx="12" fill="#115e59"/>
  <text x="444" y="561" text-anchor="middle" class="label">Program reasoning</text>
  <text x="444" y="582" text-anchor="middle" class="body">angr · Unicorn · QEMU</text>
  <rect x="588" y="535" width="236" height="62" rx="12" fill="#581c87"/>
  <text x="706" y="561" text-anchor="middle" class="label">Controlled observation</text>
  <text x="706" y="582" text-anchor="middle" class="body">GDB · Frida · isolated lab</text>
  <rect x="850" y="535" width="262" height="62" rx="12" fill="#92400e"/>
  <text x="981" y="561" text-anchor="middle" class="label">Defensive reporting</text>
  <text x="981" y="582" text-anchor="middle" class="body">triage · findings · remediation</text>

  <text x="600" y="652" text-anchor="middle" class="subtitle">Original artifacts stay immutable; stronger claims require stronger evidence.</text>
</svg>
